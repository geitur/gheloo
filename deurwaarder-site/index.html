<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon.png">
<title>Deurwaarder</title>
<style>
:root {
  --bg:       oklch(0.08 0.014 265);
  --card:     oklch(0.115 0.012 265);
  --sidebar:  oklch(0.105 0.013 265);
  --primary:  oklch(0.68 0.19 265);
  --border:   oklch(0.24 0.013 265);
  --text:     oklch(0.94 0.006 265);
  --muted:    oklch(0.56 0.016 265);
  --accent:   oklch(0.21 0.015 265);
  --input:    oklch(0.19 0.012 265);
  --radius:   8px;
  --green:    oklch(0.65 0.18 160);
  --red:      oklch(0.65 0.22 25);
  --orange:   oklch(0.65 0.18 60);
  --pink:     oklch(0.65 0.18 320);
  --purple:   oklch(0.65 0.2 300);
  --teal:     oklch(0.65 0.18 185);
  --zinc:     oklch(0.56 0.016 265);
  --yellow:   oklch(0.78 0.16 95);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* — Shell — */
#shell{display:flex;height:100vh}

/* — Sidebar — */
#sidebar{width:220px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-header{padding:18px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:color-mix(in oklch,var(--primary) 18%,transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;font:800 13px system-ui;flex-shrink:0}
.eyebrow{font:700 9px/1 monospace;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.title{font:700 15px/1.2 system-ui;color:var(--text)}
.hub-back{display:flex;align-items:center;gap:6px;margin:14px 0 0 -7px;padding:5px 7px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;transition:all .12s;width:fit-content;flex-shrink:0}
.hub-back:hover{background:var(--accent);color:var(--text)}
.hub-back svg{width:12px;height:12px;flex-shrink:0}
#sb-nav{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.nav-section-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:0 8px 4px;opacity:.7}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;text-decoration:none;transition:all .12s;user-select:none;border:none;background:none;width:100%;text-align:left}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--accent);color:var(--text)}
.nav-item.active{background:color-mix(in oklch,var(--primary) 15%,transparent);color:var(--primary);font-weight:600}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-left:auto;flex-shrink:0}

/* — Main — */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#main-content{flex:1;overflow-y:auto;padding:24px 28px}
.loading{color:var(--muted);font-size:13px;padding:48px;text-align:center}
.content-fade{animation:contentFadeIn .18s ease}
@keyframes contentFadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
.error-msg{color:var(--red);background:color-mix(in oklch,var(--red) 10%,transparent);border:1px solid color-mix(in oklch,var(--red) 30%,transparent);border-radius:8px;padding:12px 16px;margin:16px 0;font-size:13px}

/* — Page headers — */
.page-hdr{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px}
.page-hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* — Buttons — */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font:600 12px/1 inherit;cursor:pointer;border:1px solid transparent;transition:all .12s;white-space:nowrap}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
.btn-ghost:hover{color:var(--text);background:var(--accent)}
.btn-danger{background:color-mix(in oklch,var(--red) 15%,transparent);border-color:color-mix(in oklch,var(--red) 30%,transparent);color:var(--red)}
.btn-danger:hover{background:color-mix(in oklch,var(--red) 25%,transparent)}
.btn-green{background:color-mix(in oklch,var(--green) 15%,transparent);border-color:color-mix(in oklch,var(--green) 30%,transparent);color:var(--green)}
.btn-green:hover{background:color-mix(in oklch,var(--green) 25%,transparent)}
.btn-blue{background:color-mix(in oklch,var(--primary) 15%,transparent);border-color:color-mix(in oklch,var(--primary) 30%,transparent);color:var(--primary)}
.btn-blue:hover{background:color-mix(in oklch,var(--primary) 25%,transparent)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-red:hover{opacity:.9}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-sm svg{width:11px;height:11px}
button:disabled{opacity:.5;cursor:not-allowed}

/* — Cards — */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}
.card-sub{font-size:11px;color:var(--muted)}
.card-body{padding:16px}

/* — Stat cards — */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;border-left:3px solid var(--border)}
.stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;flex-shrink:0}
.stat-icon svg{width:14px;height:14px}
.stat-val{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:500}

/* — Dashboard stat row (single row, clearly ordered) — */
.dash-stats-row{display:flex;flex-wrap:wrap;gap:10px}
.dash-stat{flex:1 1 150px;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.dash-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--stat-color)}
.dash-stat:hover{transform:translateY(-2px);border-color:var(--stat-color)}
.dash-stat-val{font-size:26px;font-weight:800;line-height:1;margin-bottom:5px;color:var(--stat-color)}
.dash-stat-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.dash-chart-legend-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;opacity:.5;transition:opacity .12s,border-color .12s}
.dash-chart-legend-item.on{opacity:1;color:var(--text);border-color:var(--m-color)}
.dash-chart-legend-item:hover{opacity:.85}
.dash-chart-dot{width:8px;height:8px;border-radius:50%;background:var(--m-color);display:inline-block;flex-shrink:0}
.dash-chart-tooltip{position:absolute;top:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:5;transform:translateX(-10%)}
.trade-items-popover{position:fixed;z-index:300;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:220px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
.holder-count-btn{background:none;border:none;padding:0;cursor:pointer;font:inherit;font-size:16px;font-weight:800}

/* — Tables — */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);background:color-mix(in oklch,var(--card) 50%,var(--bg));border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid color-mix(in oklch,var(--border) 50%,transparent);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in oklch,var(--accent) 50%,transparent)}
.mono{font-family:ui-monospace,monospace;font-size:11px}
.empty-row td{text-align:center;color:var(--muted);padding:48px!important;font-size:13px}
.link{color:var(--primary);cursor:pointer;text-decoration:none;background:none;border:none;font:inherit;font-size:inherit;padding:0}
.link:hover{text-decoration:underline}

/* — Badges — */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap}
.badge-green{background:color-mix(in oklch,var(--green) 12%,transparent);color:var(--green);border-color:color-mix(in oklch,var(--green) 25%,transparent)}
.badge-orange{background:color-mix(in oklch,var(--orange) 12%,transparent);color:var(--orange);border-color:color-mix(in oklch,var(--orange) 25%,transparent)}
.badge-red{background:color-mix(in oklch,var(--red) 12%,transparent);color:var(--red);border-color:color-mix(in oklch,var(--red) 25%,transparent)}
.badge-zinc{background:color-mix(in oklch,var(--zinc) 12%,transparent);color:var(--zinc);border-color:color-mix(in oklch,var(--zinc) 25%,transparent)}
.badge-blue{background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary);border-color:color-mix(in oklch,var(--primary) 25%,transparent)}
.badge-teal{background:color-mix(in oklch,var(--teal) 12%,transparent);color:var(--teal);border-color:color-mix(in oklch,var(--teal) 25%,transparent)}
.badge-purple{background:color-mix(in oklch,var(--purple) 12%,transparent);color:var(--purple);border-color:color-mix(in oklch,var(--purple) 25%,transparent)}
.event-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* — Forms — */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
label{font-size:11px;font-weight:600;color:var(--muted)}
input,textarea,select{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font:14px inherit;outline:none;width:100%;transition:border-color .12s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:60px}
select{cursor:pointer}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.search-input{display:flex;align-items:center;position:relative}
.search-input input{padding-left:30px}
.search-input svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);pointer-events:none}

/* — Filter chips — */
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .1s}
.filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.filter-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* — Inline search — */
.inline-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.inline-filters input{background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font:12px inherit;outline:none;transition:border-color .12s;width:140px}
.inline-filters input:focus{border-color:var(--primary)}

/* — Tutorial — */
/* pointer-events:auto whenever open — blocks clicks on the real page everywhere except the
   card itself, so a spotlighted element behind it can't be accidentally clicked mid-tutorial */
#tutorial-overlay{position:fixed;inset:0;z-index:2000;display:none;pointer-events:none}
#tutorial-overlay.open{display:block;pointer-events:auto}
#tutorial-overlay.no-target{background:rgba(0,0,0,.72)}
#tutorial-spotlight{position:absolute;display:none;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);border:2px solid var(--primary);pointer-events:none;transition:left .2s ease,top .2s ease,width .2s ease,height .2s ease}
#tutorial-card{position:absolute;width:320px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.6);pointer-events:auto;transition:left .2s ease,top .2s ease}
/* buttons keep native focus after every click (the DOM node persists across steps, only its
   text changes) — left alone this shows the OS accent color as a focus ring, which can render
   green regardless of our theme. Force it off and use our own subtle indicator instead. */
#tutorial-card,#tutorial-card *,#tutorial-card *:focus,#tutorial-card *:focus-visible{outline:none!important}
#tutorial-card button:focus-visible{box-shadow:0 0 0 2px var(--primary)}
#tutorial-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#tutorial-progress{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase}
#tutorial-close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px}
#tutorial-close-btn:hover{color:var(--text)}
#tutorial-title{font-size:15px;font-weight:800;margin-bottom:6px;color:var(--text)}
#tutorial-text{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
#tutorial-nav{display:flex;align-items:center;gap:8px}

/* — Modal — */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
#modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-hdr{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-hdr h3{font-size:15px;font-weight:700;flex:1;margin:0}
.modal-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:5px;display:flex;align-items:center;transition:color .1s}
.modal-close:hover{color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.modal-wide #modal-box{max-width:720px}
.modal-error{color:var(--red);background:color-mix(in oklch,var(--red) 10%,transparent);border:1px solid color-mix(in oklch,var(--red) 30%,transparent);border-radius:6px;padding:10px 12px;font-size:12px;margin-top:10px}
.ac-wrap{position:relative}
.ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:6px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;margin-top:2px;display:none}
.ac-item{padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px}
.ac-item:hover,.ac-item:focus{background:var(--accent)}

/* — Timeline — */
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item:last-child .tl-line{display:none}
.tl-left{display:flex;flex-direction:column;align-items:center;width:10px;flex-shrink:0}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.tl-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.tl-body{flex:1;min-width:0}
.tl-type{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.tl-meta{font-size:10px;color:var(--muted);margin-bottom:5px}
.tl-content{font-size:12px;display:flex;flex-direction:column;gap:2px}

/* — Asset cards (Quick Actions) — */
.asset-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.asset-card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.asset-card-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}

/* — Checkbox list (Bulk Scam) — */
.bulk-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;max-height:500px}
.check-panel-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;flex-shrink:0}
.check-list{flex:1;overflow-y:auto}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid color-mix(in oklch,var(--border) 40%,transparent);cursor:pointer;transition:background .08s}
.check-item:last-child{border-bottom:none}
.check-item:hover{background:var(--accent)}
.check-item.selected{background:color-mix(in oklch,var(--primary) 10%,transparent)}
.check-box{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .1s}
.check-box.checked{background:var(--primary);border-color:var(--primary)}
.check-box.checked::after{content:'✓';color:#fff;font-size:10px;font-weight:800}
.check-info{flex:1;min-width:0}
.check-id{font-family:ui-monospace,monospace;font-size:11px;color:var(--primary);font-weight:600}
.check-name{font-size:11px;color:var(--muted);truncate:ellipsis;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scam-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.scam-form h3{font-size:12px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* — Item type chips — */
.type-list{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-top:8px}
.type-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg)}
.type-name{font-size:12px;flex:1}

/* — Scanned/pulled colors — */
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-orange{color:var(--orange)}
.text-muted{color:var(--muted)}
.text-primary{color:var(--primary)}
.text-yellow{color:var(--yellow)}

/* — Activity feed — */
.activity-row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-bottom:1px solid color-mix(in oklch,var(--border) 40%,transparent);transition:background .08s}
.activity-row:last-child{border-bottom:none}
.activity-row:hover{background:var(--accent)}
.activity-body{flex:1;min-width:0}
.activity-top{display:flex;align-items:center;gap:6px;font-size:11px}
.activity-time{font-size:10px;color:var(--muted);margin-left:auto;flex-shrink:0}
.activity-detail{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* — Breadcrumb — */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:16px}
.breadcrumb svg{width:12px;height:12px;color:var(--muted)}

/* — Two-col detail — */
.detail-grid{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.summary-card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
.summary-card-body{padding:0 16px}
.sum-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid color-mix(in oklch,var(--border) 50%,transparent);font-size:12px}
.sum-row:last-child{border-bottom:none}
.sum-label{color:var(--muted)}

/* — Bundle row highlight — */
.bundle-hdr-row td{background:color-mix(in oklch,var(--orange) 8%,transparent)!important;border-left:3px solid color-mix(in oklch,var(--orange) 50%,transparent)}
.bundle-child-row td{border-left:3px solid color-mix(in oklch,var(--orange) 20%,transparent);padding-left:25px!important}
.bundle-child-row td:first-child{padding-left:32px!important}

/* — Row thumbnail (item photo, inline in tables) — */
.row-thumb{width:22px;height:22px;border-radius:4px;object-fit:contain;background:var(--input);border:1px solid var(--border);flex-shrink:0;vertical-align:middle;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.row-thumb-ph{width:22px;height:22px;border-radius:4px;background:var(--input);border:1px solid var(--border);flex-shrink:0;display:inline-block}
.item-cell{display:flex;align-items:center;gap:8px}

/* — Inventory catalog grid — */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;cursor:pointer;transition:border-color .12s;position:relative}
.cat-card:hover{border-color:var(--primary)}
.cat-thumb{width:100%;aspect-ratio:1;border-radius:6px;background:var(--input);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;padding:10%}
.cat-thumb img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.cat-thumb-ph{color:var(--muted);font-size:20px;font-weight:700}
.cat-name{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.cat-qty{position:absolute;top:6px;right:6px;background:var(--primary);color:#fff;font-size:13px;font-weight:800;padding:3px 9px;border-radius:20px;line-height:1.3;border:2px solid rgba(0,0,0,.75);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cat-grid-lg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cat-grid-lg .cat-card{padding:12px}
.cat-grid-lg .cat-name{font-size:12px;min-height:32px}

/* — Settings: item image rows — */
.catimg-list{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.catimg-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg)}
.catimg-thumb{width:28px;height:28px;border-radius:5px;background:var(--input);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.catimg-thumb img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.catimg-thumb img{width:100%;height:100%;object-fit:contain}
.catimg-name{font-size:11px;flex:0 0 200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catimg-input{flex:1;padding:5px 8px;font-size:11px}

/* — Rolimons-style item slots (Scam Import) — */
.scam-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scam-col{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-box{aspect-ratio:1;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;background:var(--input);overflow:hidden;transition:border-color .12s}
.slot-box:hover{border-color:var(--primary)}
.slot-box.active{border-color:var(--primary);border-style:solid}
.slot-box.filled{border-style:solid;border-color:var(--border);cursor:default}
.slot-box img{width:100%;height:100%;object-fit:contain;padding:4px;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.slot-name{position:absolute;bottom:0;left:0;right:0;font-size:9px;text-align:center;padding:2px 3px;color:#fff;background:rgba(0,0,0,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-remove{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:11px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.slot-remove:hover{background:var(--red)}
.slot-qty{position:absolute;top:2px;left:2px;background:var(--primary);color:#fff;border-radius:50%;min-width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.slot-qty-controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:4px;opacity:0;transition:opacity .12s}
.slot-box.filled:hover .slot-qty-controls{opacity:1}
.slot-qty-controls button{background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;width:14px;height:14px;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot-qty-controls button:hover{background:var(--primary)}
.slot-qty-controls button:disabled{opacity:.3;cursor:not-allowed}
.slot-qty-controls button:disabled:hover{background:rgba(0,0,0,.75)}
</style>
</head>
