<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="design.css?v=8">
<title>Furnis</title>
<style>
/* Page-specific only — shared tokens/shell/buttons/tables/pagination/forms live in
   design.css. Only this page's own bits (sidebar stat block, highlight/ints cell) stay
   here. */
/* This sidebar's tabs sit directly under .sb-header (no #tabs/#sb-nav wrapper), so they
   need their own left/right inset instead of relying on a wrapping container's padding. */
.nav-section-lbl{padding:14px 16px 4px}
.tab{padding:8px 16px}
#sb-body{padding:14px 16px;flex:1;overflow-y:auto}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat-bar-track{height:5px;border-radius:3px;background:var(--accent);margin-top:12px;overflow:hidden}
.stat-bar-fill{height:100%;background:var(--primary);border-radius:3px}

.ints-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl-match{background:color-mix(in oklch,var(--primary) 35%,transparent);color:var(--text);border-radius:2px;padding:0 1px}
.loading-note{font-size:11px;color:var(--muted);margin-top:8px;opacity:.8}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="sb-header">
      <div class="brand-row">
        <div class="brand-mark">G</div>
        <div>
          <div class="eyebrow">Gheloo</div>
          <div class="title">Furnis</div>
        </div>
      </div>
      <a class="hub-back" href="https://hub.databin.uk/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Terug naar Hub</a>
    </div>
    <div class="nav-section-lbl">Datasets</div>
    <button class="tab active" id="tab-furnis" data-tab="furnis">Koopbaar (catalogus)<span class="nav-dot"></span></button>
    <button class="tab" id="tab-master" data-tab="master">Alle Furni (compleet)<span class="nav-dot"></span></button>
    <div id="sb-body">
      <div class="stat-lbl" id="stat-lbl">Unieke offers bekend</div>
      <div class="stat-val" id="stat-count">—</div>
    </div>
  </aside>

  <div id="main">
    <div class="page-hdr">
      <div>
        <div class="page-title" id="page-title">Catalogus</div>
        <div class="page-sub" id="page-sub">Gescande offers uit de Room Clone-extensie, samengevoegd van alle gebruikers</div>
      </div>
      <div style="display:flex;gap:8px">
        <input class="search-input" id="search" placeholder="Zoek...">
        <button class="btn btn-outline" id="export-btn">Export TXT</button>
      </div>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead id="thead-row"></thead>
        <tbody id="tbl-body">
          <tr class="empty-row"><td colspan="7">Laden…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
