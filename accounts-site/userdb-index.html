<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="design.css?v=8">
<title>User Database</title>
<style>
/* Page-specific only — shared tokens/shell/buttons/cards/tables/pagination/forms live in
   design.css. Only this page's own bits (avatar thumb, sticky header, filter field widths)
   stay here — selection state is just .tab.active's background/color, same as everywhere
   else, no separate checkbox indicator. */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-input{width:auto;max-width:none}
#q_name{width:200px}
#q_id, #q_id_min, #q_id_max{width:110px}

#status{font-size:12px;color:var(--muted);margin-bottom:10px}

.tbl-wrap{max-height:64vh}
thead th{position:sticky;top:0}
.avatar-wrap{position:relative;width:36px;height:36px;overflow:hidden;border-radius:6px;display:inline-block;vertical-align:middle;background:var(--input)}
.avatar-wrap img{position:absolute;left:-14px;top:-20px;width:62px;height:90px;image-rendering:pixelated}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="sb-header">
      <div class="brand-row">
        <div class="brand-mark">G</div>
        <div>
          <div class="eyebrow">Gheloo</div>
          <div class="title">User Database</div>
        </div>
      </div>
      <a class="hub-back" href="https://hub.databin.uk/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Terug naar Hub</a>
    </div>
    <nav id="sb-nav">
      <div>
        <div class="nav-section-lbl">Sorteren</div>
        <div class="nav-group" id="sort-tabs"></div>
      </div>

      <div>
        <div class="nav-section-lbl">Kolommen</div>
        <div class="nav-group" id="col-tabs"></div>
      </div>
    </nav>
  </aside>

  <div id="main">
    <div class="page-hdr">
      <div>
        <div class="page-title">Zoeken</div>
        <div class="page-sub">Alle gescande gebruikers uit de room-logger</div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="filter-row">
          <input class="search-input" id="q_name" placeholder="Naam bevat...">
          <input class="search-input" id="q_id" placeholder="Exact ID" type="number">
          <input class="search-input" id="q_id_min" placeholder="ID vanaf" type="number">
          <input class="search-input" id="q_id_max" placeholder="ID tot" type="number">
          <button class="btn btn-blue" onclick="search(true)">Zoeken</button>
          <button class="btn btn-outline" id="exportBtn" onclick="exportTxt()">Exporteer TXT</button>
        </div>
      </div>
    </div>

    <div id="status"></div>

    <div class="tbl-wrap">
      <table id="mainTable">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const BASE = 'https://userlogger.databin.uk/rest/v1/users';
const AVATARS_BASE = 'https://userlogger.databin.uk/rest/v1/user_avatars';
const PAGE_SIZE_OPTIONS = [100, 250, 500];
const PAGE_SIZE_KEY = 'gheloo_userdb_page_size';
let LIMIT = PAGE_SIZE_OPTIONS.includes(parseInt(localStorage.getItem(PAGE_SIZE_KEY), 10)) ? parseInt(localStorage.getItem(PAGE_SIZE_KEY), 10) : 500;

const COLUMNS = [
  { key: 'figure',             label: 'Avatar',        default: true, isAvatar: true },
  { key: 'id',                 label: 'ID',            default: true },
  { key: 'name',                label: 'Naam',          default: true },
  { key: 'motto',               label: 'Motto',         default: true },
  { key: 'achievement_score',  label: 'Score',         default: true },
  { key: 'favorite_group',     label: 'Groep',         default: true },
  { key: 'last_seen',          label: 'Laatst gezien', default: true },
];

const SORTS = [
  { key: 'id.asc',                  label: 'Oudste ID' },
  { key: 'id.desc',                 label: 'Nieuwste ID' },
  { key: 'last_seen.desc.nullslast', label: 'Laatst gezien' },
  { key: 'name.asc',                label: 'Naam A-Z' },
  { key: 'achievement_score.desc',  label: 'Hoogste score' },
];

let lastRows = [];
let avatarByUserId = new Map();
let currentOffset = 0;

async function loadCachedAvatars(ids) {
  avatarByUserId = new Map();
  if (!ids.length) return;
  try {
    const res = await fetch(AVATARS_BASE + '?id=in.(' + ids.join(',') + ')&select=id,image_base64');
    if (res.ok) {
      const rows = await res.json();
      rows.forEach(r => { if (r.image_base64) avatarByUserId.set(r.id, 'data:image/png;base64,' + r.image_base64); });
    }
  } catch (e) { /* best-effort — falls back to the live leet.city URL per-row */ }
}
let totalMatches = 0;
let currentSort = SORTS[0].key;
let visibleCols = new Set(COLUMNS.filter(c => c.default).map(c => c.key));

function currentPage() { return Math.floor(currentOffset / LIMIT) + 1; }
function totalPages() { return totalMatches ? Math.ceil(totalMatches / LIMIT) : 1; }

function gotoPage(n) {
  const tp = totalPages();
  n = Math.max(1, Math.min(n, tp));
  currentOffset = (n - 1) * LIMIT;
  search(false);
}
function skipPages(delta) { gotoPage(currentPage() + delta); }

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function avatarUrl(figure) {
  return 'https://www.leet.city/leet-imaging/avatarimage?figure=' + encodeURIComponent(figure || '')
    + '&direction=2&head_direction=3&size=m&gesture=sml&headonly=1&action=wav&img_format=png';
}

function renderSortTabs() {
  const el = document.getElementById('sort-tabs');
  el.innerHTML = SORTS.map(s =>
    '<button class="tab' + (currentSort === s.key ? ' active' : '') + '" data-sort="' + s.key + '">' + s.label + '</button>'
  ).join('');
  el.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSort = btn.dataset.sort;
      renderSortTabs();
      search(true);
    });
  });
}

function renderColTabs() {
  const el = document.getElementById('col-tabs');
  el.innerHTML = COLUMNS.map(c =>
    '<button class="tab' + (visibleCols.has(c.key) ? ' active' : '') + '" data-col="' + c.key + '">' + c.label + '</button>'
  ).join('');
  el.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.col;
      visibleCols.has(key) ? visibleCols.delete(key) : visibleCols.add(key);
      renderColTabs();
      renderTable();
    });
  });
}

function activeColumns() {
  return COLUMNS.filter(c => visibleCols.has(c.key));
}

function renderTable() {
  const cols = activeColumns();
  document.getElementById('head').innerHTML = cols.map(c => '<th>' + c.label + '</th>').join('');
  document.getElementById('rows').innerHTML = lastRows.map(u => (
    '<tr>' + cols.map(c => {
      if (c.isAvatar) {
        // leet.city's own avatarimage endpoint now sits behind a Cloudflare CAPTCHA
        // challenge for cross-site embedding (confirmed live 2026-08-29) — no client-side
        // fix for that (pacing/retries don't help, and bypassing a CAPTCHA isn't something
        // to build). user_avatars holds a copy captured by the extension itself while it
        // was already on leet.city (real logged-in session, never blocked) — use that when
        // we have it, otherwise fall back to the live leet.city URL for whatever still works.
        const cached = avatarByUserId.get(u.id);
        const src = cached || avatarUrl(u.figure);
        return '<td>' + (u.figure ? '<span class="avatar-wrap"><img src="' + esc(src) + '" loading="lazy" onerror="this.style.opacity=\'.15\'"></span>' : '') + '</td>';
      }
      let v = u[c.key];
      if (c.key === 'last_seen') v = v ? new Date(v).toLocaleString('nl-BE') : '—';
      return '<td>' + esc(v) + '</td>';
    }).join('') + '</tr>'
  )).join('');
}

function fmtVal(u, key) {
  if (key === 'last_seen') return u[key] ? new Date(u[key]).toLocaleString('nl-BE') : null;
  return u[key];
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (!totalMatches) { el.innerHTML = ''; return; }
  // Skip the rebuild while the page-jump box is focused — a refresh mid-type would wipe
  // out what's typed and drop focus. Catches up on the next render after blur/submit.
  if (document.activeElement && document.activeElement.id === 'pg-jump') return;
  const tp = totalPages();
  const atStart = currentOffset === 0, atEnd = lastRows.length < LIMIT;
  el.innerHTML =
    '<button class="btn btn-outline" id="pg-first" title="Eerste pagina"' + (atStart ? ' disabled' : '') + '>&laquo;&laquo;&laquo;</button>'
    + '<button class="btn btn-outline" id="pg-back10" title="10 pagina\'s terug"' + (atStart ? ' disabled' : '') + '>&laquo;&laquo;</button>'
    + '<button class="btn btn-outline" id="pg-prev" title="Vorige"' + (atStart ? ' disabled' : '') + '>&laquo;</button>'
    + '<input class="page-jump" id="pg-jump" type="number" min="1" max="' + tp + '" value="' + currentPage() + '">'
    + '<span class="page-info">/ ' + tp + ' (' + totalMatches + ' users)</span>'
    + '<button class="btn btn-outline" id="pg-next" title="Volgende"' + (atEnd ? ' disabled' : '') + '>&raquo;</button>'
    + '<button class="btn btn-outline" id="pg-fwd10" title="10 pagina\'s vooruit"' + (atEnd ? ' disabled' : '') + '>&raquo;&raquo;</button>'
    + '<button class="btn btn-outline" id="pg-last" title="Laatste pagina"' + (atEnd ? ' disabled' : '') + '>&raquo;&raquo;&raquo;</button>'
    + '<select class="page-size-select" id="pg-size" title="Gebruikers per pagina">'
    + PAGE_SIZE_OPTIONS.map(n => '<option value="' + n + '"' + (n === LIMIT ? ' selected' : '') + '>' + n + '</option>').join('')
    + '</select>';
  el.querySelector('#pg-first') && (el.querySelector('#pg-first').onclick = () => gotoPage(1));
  el.querySelector('#pg-back10') && (el.querySelector('#pg-back10').onclick = () => skipPages(-10));
  el.querySelector('#pg-prev') && (el.querySelector('#pg-prev').onclick = () => skipPages(-1));
  el.querySelector('#pg-next') && (el.querySelector('#pg-next').onclick = () => skipPages(1));
  el.querySelector('#pg-fwd10') && (el.querySelector('#pg-fwd10').onclick = () => skipPages(10));
  el.querySelector('#pg-last') && (el.querySelector('#pg-last').onclick = () => gotoPage(tp));
  const jump = el.querySelector('#pg-jump');
  jump.addEventListener('keydown', e => { if (e.key === 'Enter') gotoPage(parseInt(e.target.value, 10) || 1); });
  jump.addEventListener('focusout', e => gotoPage(parseInt(e.target.value, 10) || 1));
  el.querySelector('#pg-size').addEventListener('change', e => {
    LIMIT = parseInt(e.target.value, 10) || 500;
    localStorage.setItem(PAGE_SIZE_KEY, String(LIMIT));
    currentOffset = 0;
    search(false);
  });
}

// While a name filter is active, put the closest match first within the current
// page (exact match, then starts-with, then plain contains) instead of leaving
// server order (id/last_seen/etc.) — the chosen sort still applies when not searching.
function sortByRelevance() {
  const q = document.getElementById('q_name').value.trim().toLowerCase();
  if (!q) return;
  const score = u => {
    const name = (u.name || '').toLowerCase();
    if (name === q) return 0;
    if (name.indexOf(q) === 0) return 1;
    return 2;
  };
  lastRows.sort((a, b) => score(a) - score(b));
}

async function search(reset) {
  if (reset) currentOffset = 0;
  const statusEl = document.getElementById('status');
  const params = currentFilterParams().concat(['limit=' + LIMIT, 'offset=' + currentOffset]);

  statusEl.textContent = 'Zoeken...';
  try {
    const res = await fetch(BASE + '?' + params.join('&'), { headers: { 'Prefer': 'count=exact' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const range = res.headers.get('content-range') || '';
    const total = (range.split('/')[1]) || '?';
    totalMatches = parseInt(total, 10) || 0;
    lastRows = await res.json();
    sortByRelevance();
    const from = total !== '?' && total !== '0' ? (currentOffset + 1) : 0;
    const to = currentOffset + lastRows.length;
    statusEl.textContent = (lastRows.length ? (from + '–' + to) : '0') + ' van ' + total + ' matches';
    await loadCachedAvatars(lastRows.map(u => u.id));
    renderTable();
    renderPagination();
  } catch (e) {
    statusEl.textContent = 'Fout: ' + e.message;
  }
}

function currentFilterParams() {
  const name = document.getElementById('q_name').value.trim();
  const id = document.getElementById('q_id').value.trim();
  const idMin = document.getElementById('q_id_min').value.trim();
  const idMax = document.getElementById('q_id_max').value.trim();
  const params = ['select=id,name,motto,figure,achievement_score,favorite_group,last_seen'];
  if (id) params.push('id=eq.' + encodeURIComponent(id));
  if (idMin) params.push('id=gte.' + encodeURIComponent(idMin));
  if (idMax) params.push('id=lte.' + encodeURIComponent(idMax));
  if (name) params.push('name=ilike.*' + encodeURIComponent(name) + '*');
  params.push('order=' + currentSort);
  return params;
}

async function fetchAllMatching(onProgress) {
  const baseParams = currentFilterParams();
  const pageSize = 10000;
  let offset = 0;
  let all = [];
  for (;;) {
    const params = baseParams.concat(['limit=' + pageSize, 'offset=' + offset]);
    const res = await fetch(BASE + '?' + params.join('&'));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const page = await res.json();
    all = all.concat(page);
    if (onProgress) onProgress(all.length);
    if (page.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

async function exportTxt() {
  const btn = document.getElementById('exportBtn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  try {
    const all = await fetchAllMatching(n => { statusEl.textContent = 'Exporteren... (' + n + ' opgehaald)'; });
    if (!all.length) { statusEl.textContent = 'Niks om te exporteren.'; return; }
    const cols = activeColumns();
    const lines = [cols.map(c => c.label).join('\t')];
    all.forEach(u => {
      lines.push(cols.map(c => {
        const v = fmtVal(u, c.key);
        return v == null ? '' : String(v);
      }).join('\t'));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gheloo-users-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = all.length + ' users geëxporteerd.';
  } catch (e) {
    statusEl.textContent = 'Export fout: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.querySelectorAll('#q_name, #q_id, #q_id_min, #q_id_max').forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') search(true); });
});

renderSortTabs();
renderColTabs();
search(true);

// Fire-and-forget — lets the CPU/DB history panel on hub.databin.uk line spikes up
// against actual site visits instead of showing an unexplained number.
fetch('https://userlogger.databin.uk/rest/v1/event_log', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ event: 'visit', detail: 'userdb' }),
}).catch(function () {});
</script>
</body>
</html>
